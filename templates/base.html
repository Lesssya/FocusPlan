<!doctype html>
<html lang="ru" data-accent="{{ settings.accent if settings else 'purple' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusPlan</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-confetti-earned="{{ confetti.earned if confetti else '' }}">
  {% if user %}
  <aside class="sidebar">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="logo">✦</span><span>FocusPlan</span></a>
    <nav class="menu">
      <a class="{{ 'active' if current_endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">Главная</a>
      <a class="{{ 'active' if current_endpoint == 'calendar' }}" href="{{ url_for('calendar') }}">Календарь</a>
      <a class="{{ 'active' if current_endpoint in ['tasks_page','toggle_task','toggle_subtask','edit_task'] }}" href="{{ url_for('tasks_page') }}">Задачи</a>
      <a class="{{ 'active' if current_endpoint == 'matrix' }}" href="{{ url_for('matrix') }}">Приоритеты</a>
      <a class="{{ 'active' if current_endpoint in ['focus','complete_focus'] }}" href="{{ url_for('focus') }}">Фокус</a>
    </nav>
    <a class="level-card" href="{{ url_for('profile') }}">
      <div class="level-row"><b>Уровень {{ level }}</b><span>{{ level_progress }}/100 опыта</span></div>
      <div class="progress"><i style="width: {{ level_progress }}%"></i></div>
    </a>
    <a class="sidebar-card {{ 'active-profile' if current_endpoint == 'profile' }}" href="{{ url_for('profile') }}">
      <div class="avatar small">{{ user.avatar }}</div>
      <div class="profile-text"><b>{{ user.nickname }}</b><p>Профиль и настройки</p></div><span class="chevron">›</span>
    </a>
    <a class="logout" href="{{ url_for('logout') }}">Выйти</a>
  </aside>
  {% endif %}
  <main class="{{ 'app-main' if user else 'login-main' }}">
    {% block content %}{% endblock %}
  </main>
  <div id="confettiLayer"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
