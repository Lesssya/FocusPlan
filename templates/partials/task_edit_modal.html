<div class="modal" id="editModal-{{ task.id }}">
  <div class="modal-card wide-modal">
    <button class="icon-btn modal-close" data-modal-close type="button">×</button>
    <h2>Редактировать задачу</h2>
    <form method="post" action="{{ url_for('edit_task', task_id=task.id) }}" class="form-grid">
      <label>Название задачи</label><input name="title" value="{{ task.title }}" required>
      <label>Описание задачи</label><textarea class="task-description-input" name="description" rows="2">{{ task.description }}</textarea>
      <label>Подпункты</label>
      <div class="subtask-editor" data-subtask-editor>
        {% for subtask in task.subtasks %}<div class="subtask-input-row"><input name="subtask_items" value="{{ subtask.title }}"><button class="icon-btn" type="button" data-remove-subtask>×</button></div>{% endfor %}
        <div class="subtask-input-row"><input name="subtask_items" placeholder="Добавить подпункт"><button class="icon-btn" type="button" data-add-subtask>+</button></div>
      </div>
      <div class="two-cols"><div><label>Дата выполнения</label><input type="date" name="date" value="{{ task.date }}"></div><div><label>Время</label><input type="time" name="time" value="{{ task.time }}"></div></div>
      <div class="two-cols"><div><label>Папка</label><select name="folder"><option value="" {{ 'selected' if not task.folder }}>Без папки</option>{% for folder in user.folders %}<option value="{{ folder }}" {{ 'selected' if task.folder == folder }}>{{ folder }}</option>{% endfor %}</select><input class="mt mini-input" name="new_folder" placeholder="Или новая папка"></div><div><label>Примерное время</label><div class="estimate-row"><input type="number" min="0" name="estimate_value" value="{{ task.estimate_value }}"><select name="estimate_unit"><option value="minutes" {{ 'selected' if task.estimate_unit == 'minutes' }}>мин.</option><option value="hours" {{ 'selected' if task.estimate_unit == 'hours' }}>ч.</option><option value="days" {{ 'selected' if task.estimate_unit == 'days' }}>дн.</option></select></div></div></div>
      <div class="three-cols task-logic-row"><div><label>Срочность</label><select name="urgency" data-task-urgency><option value="not_urgent" {{ 'selected' if task.urgency == 'not_urgent' }}>Не срочно</option><option value="urgent" {{ 'selected' if task.urgency == 'urgent' }}>Срочно</option></select></div><div><label>Важность</label><select name="importance" data-task-importance><option value="low" {{ 'selected' if task.importance == 'low' }}>Низкая</option><option value="medium" {{ 'selected' if task.importance == 'medium' }}>Средняя</option><option value="high" {{ 'selected' if task.importance == 'high' }}>Высокая</option></select></div><div><label>Автоприоритет</label><div class="auto-priority-pill {{ task.priority }}" data-auto-priority>{{ priority_labels[task.priority] }}</div><small>Рассчитывается автоматически</small></div></div>
      <button class="btn primary" type="submit">Сохранить изменения</button>
    </form>
  </div>
</div>
