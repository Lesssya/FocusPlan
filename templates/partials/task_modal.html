<div class="modal" id="taskModal">
  <div class="modal-card wide-modal">
    <button class="icon-btn modal-close" data-modal-close type="button">×</button>
    <h2>Новая задача</h2>
    <form method="post" action="{{ url_for('add_task') }}" class="form-grid">
      <label>Название задачи</label>
      <input name="title" placeholder="Например, написать параграф 2.3" required>

      <label>Описание задачи</label>
      <textarea class="task-description-input" name="description" rows="2" placeholder="Кратко опишите, что нужно сделать"></textarea>

      <label>Подпункты</label>
      <div class="subtask-editor" data-subtask-editor>
        <div class="subtask-input-row"><input name="subtask_items" placeholder="Например, собрать материалы"><button class="icon-btn" type="button" data-add-subtask>+</button></div>
      </div>

      <div class="two-cols">
        <div><label>Дата выполнения</label><input type="date" name="date"><small>Можно оставить пустым</small></div>
        <div><label>Время</label><input type="time" name="time"><small>Можно оставить пустым</small></div>
      </div>

      <div class="two-cols">
        <div><label>Папка</label><select name="folder" data-task-folder>{% for folder in user.folders %}<option value="{{ folder }}">{{ folder }}</option>{% endfor %}</select><input class="mt mini-input" name="new_folder" placeholder="Или новая папка"></div>
        <div><label>Примерное время</label><div class="estimate-row"><input type="number" min="0" name="estimate_value" placeholder="Напр. 2"><select name="estimate_unit"><option value="minutes">мин.</option><option value="hours" selected>ч.</option><option value="days">дн.</option></select></div><small>Нужно для оценки трудоёмкости</small></div>
      </div>

      <div class="three-cols task-logic-row">
        <div><label>Срочность</label><select name="urgency" data-task-urgency><option value="not_urgent" selected>Не срочно</option><option value="urgent">Срочно</option></select></div>
        <div><label>Важность</label><select name="importance" data-task-importance><option value="low">Низкая</option><option value="medium" selected>Средняя</option><option value="high">Высокая</option></select></div>
        <div><label>Автоприоритет</label><div class="auto-priority-pill medium" data-auto-priority>Средний</div><small>Рассчитывается автоматически</small></div>
      </div>


      <button class="btn primary" type="submit">Добавить задачу</button>
    </form>
  </div>
</div>
